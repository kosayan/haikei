<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景処理ツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a; --surface: #141414; --border: #2a2a2a;
  --accent: #e8ff00; --text: #f0f0f0; --muted: #555;
  --mono: 'Courier New', monospace;
}
body {
  background: var(--bg); color: var(--text); font-family: var(--mono);
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 28px 16px; gap: 16px;
}
header {
  width: 100%; max-width: 860px;
  border-bottom: 1px solid var(--border); padding-bottom: 14px;
  display: flex; align-items: baseline; gap: 14px;
}
header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.12em; color: var(--accent); }
header span { font-size: 11px; color: var(--muted); }
.layout { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }
.dropzone {
  border: 1px dashed var(--border); background: var(--surface);
  height: 110px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: all 0.15s; position: relative;
}
.dropzone:hover, .dropzone.over { border-color: var(--accent); background: #1a1a0a; }
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.dropzone-label { font-size: 12px; color: var(--muted); }
.ctrl-bar {
  background: var(--surface); border: 1px solid var(--border);
  padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;
}
.ctrl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctrl-label { font-size: 11px; color: var(--muted); white-space: nowrap; min-width: 110px; }
input[type=range] {
  flex: 1; min-width: 80px; -webkit-appearance: none; appearance: none;
  height: 2px; background: var(--border); outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; background: var(--accent); cursor: pointer;
}
input[type=range]::-moz-range-thumb {
  width: 13px; height: 13px; background: var(--accent); border: none; cursor: pointer;
}
.ctrl-val { font-size: 12px; color: var(--accent); min-width: 36px; text-align: right; }
.color-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 28px; height: 28px; border: 1px solid var(--border);
  cursor: pointer; flex-shrink: 0; position: relative;
}
.swatch input[type=color] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}
.hex { font-size: 12px; color: var(--accent); letter-spacing: 0.08em; min-width: 70px; }
.mbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.mbtn {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
  padding: 5px 10px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer;
}
.mbtn.on { border-color: var(--accent); color: var(--accent); background: #1a1a0a; }
/* 出力モード切替 */
.out-mode-bar {
  display: flex; border: 1px solid var(--border); overflow: hidden;
}
.out-mbtn {
  flex: 1; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em;
  padding: 9px 8px; border: none; border-right: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; text-align: center;
}
.out-mbtn:last-child { border-right: none; }
.out-mbtn.on { background: #1a1a0a; color: var(--accent); }
/* 塗り替え色行（出力モードが塗り替えのときだけ表示） */
#fillColorRow { display: none; }
#fillColorRow.visible { display: flex; }
/* preview */
.preview-wrap {
  display: none; position: relative;
  border: 1px solid var(--border); overflow: hidden;
}
.preview-wrap.visible { display: block; }
.checker-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(45deg,#222 25%,transparent 25%),
    linear-gradient(-45deg,#222 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#222 75%),
    linear-gradient(-45deg,transparent 75%,#222 75%);
  background-size: 16px 16px;
  background-position: 0 0,0 8px,8px -8px,-8px 0;
}
#previewCanvas { display: block; width: 100%; height: auto; position: relative; }
.eyedrop-hint { display: none; font-size: 11px; color: var(--accent); padding: 4px 0; }
.eyedrop-hint.visible { display: block; }
.btn-row { display: flex; gap: 8px; }
.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
  padding: 10px 18px; border: 1px solid var(--border);
  background: transparent; color: var(--text); cursor: pointer;
}
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.status { font-size: 11px; color: var(--muted); min-height: 16px; }
/* 保存オーバーレイ */
#saveOverlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.93); z-index: 100;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px;
}
#saveOverlay.show { display: flex; }
#saveOverlay img { max-width: 100%; max-height: 60vh; border: 1px solid #333; }
#saveOverlay p { font-size: 13px; color: #aaa; text-align: center; line-height: 1.7; }
#saveOverlay button {
  font-family: var(--mono); font-size: 12px;
  padding: 10px 24px; border: 1px solid #555;
  background: transparent; color: #f0f0f0; cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>背景処理ツール</h1>
  <span>透過 / 色塗り替え</span>
</header>
<div class="layout">

  <div class="dropzone" id="dropzone">
    <input type="file" accept="image/*" id="fileInput">
    <div style="font-size:26px;opacity:0.3">⊕</div>
    <div class="dropzone-label" id="dropLabel">画像をドロップ、またはタップして選択</div>
  </div>

  <div class="ctrl-bar">

    <!-- 出力モード -->
    <div class="ctrl-row">
      <div class="ctrl-label">出力モード</div>
      <div class="out-mode-bar" style="flex:1">
        <button class="out-mbtn on" id="omTransp" onclick="setOutMode('transp')">透過（PNG）</button>
        <button class="out-mbtn" id="omFill"   onclick="setOutMode('fill')">色に塗り替え</button>
      </div>
    </div>

    <!-- 塗り替え色（fillモード時のみ） -->
    <div class="ctrl-row" id="fillColorRow">
      <div class="ctrl-label">塗り替え色</div>
      <div class="color-row">
        <div class="swatch" id="fillSwatchEl">
          <input type="color" id="fillColorPicker" value="#ffffff">
        </div>
        <div class="hex" id="fillColorHex">#FFFFFF</div>
      </div>
    </div>

    <!-- 背景色 -->
    <div class="ctrl-row">
      <div class="ctrl-label">背景色</div>
      <div class="color-row">
        <div class="swatch" id="bgSwatchEl">
          <input type="color" id="bgColorPicker" value="#000000">
        </div>
        <div class="hex" id="bgColorHex">#000000</div>
        <div class="mbtns">
          <button class="mbtn on" id="btnManual" onclick="setPickMode('manual')">手動</button>
          <button class="mbtn" id="btnEye" onclick="setPickMode('eye')">スポイト</button>
        </div>
      </div>
    </div>

    <!-- Threshold -->
    <div class="ctrl-row">
      <div class="ctrl-label">許容誤差</div>
      <input type="range" id="threshold" min="0" max="150" value="30">
      <div class="ctrl-val" id="thresholdVal">30</div>
    </div>

    <!-- Softness -->
    <div class="ctrl-row">
      <div class="ctrl-label">境界のぼかし</div>
      <input type="range" id="softness" min="0" max="60" value="10">
      <div class="ctrl-val" id="softnessVal">10</div>
    </div>

    <!-- Spill -->
    <div class="ctrl-row">
      <div class="ctrl-label">色かぶり除去</div>
      <input type="range" id="spill" min="0" max="100" value="0">
      <div class="ctrl-val" id="spillVal">0</div>
    </div>

  </div>

  <div class="eyedrop-hint" id="eyedropHint">▶ 画像をタップして背景色をピックしてください</div>

  <div class="preview-wrap" id="previewWrap">
    <div class="checker-bg" id="checkerBg"></div>
    <canvas id="previewCanvas"></canvas>
  </div>

  <div class="status" id="status"></div>

  <div class="btn-row">
    <button class="btn primary" id="dlBtn" disabled onclick="doDl()">↓ 保存</button>
  </div>

</div>

<!-- 保存オーバーレイ -->
<div id="saveOverlay">
  <img id="saveImg" src="" alt="出力画像">
  <p>iOSは長押し →「写真に追加」で保存<br>PCは右クリック → 名前を付けて保存</p>
  <button onclick="document.getElementById('saveOverlay').className=''">閉じる</button>
</div>

<canvas id="srcCanvas" style="display:none"></canvas>

<script>
var srcImg=null, imgW=0, imgH=0;
var pickMode='manual';
var outMode='transp'; // transp | fill
var bgColor={r:0,g:0,b:0};
var fillColor={r:255,g:255,b:255};
var renderScheduled=false;
var lastResult=null;

// ---- load ----
var dropzone=document.getElementById('dropzone');
dropzone.addEventListener('dragover',function(e){e.preventDefault();dropzone.classList.add('over');});
dropzone.addEventListener('dragleave',function(){dropzone.classList.remove('over');});
dropzone.addEventListener('drop',function(e){e.preventDefault();dropzone.classList.remove('over');loadImg(e.dataTransfer.files[0]);});
document.getElementById('fileInput').onchange=function(){loadImg(this.files[0]);};

function loadImg(f){
  if(!f||!f.type.match(/^image\//)) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      srcImg=img; imgW=img.width; imgH=img.height;
      var sc=document.getElementById('srcCanvas');
      sc.width=imgW; sc.height=imgH;
      sc.getContext('2d').drawImage(img,0,0);
      var pc=document.getElementById('previewCanvas');
      pc.width=imgW; pc.height=imgH;
      document.getElementById('previewWrap').classList.add('visible');
      document.getElementById('dropLabel').textContent='✓ 読み込み済み（タップで変更）';
      scheduleRender();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

// ---- 出力モード ----
function setOutMode(m){
  outMode=m;
  document.getElementById('omTransp').className='out-mbtn'+(m==='transp'?' on':'');
  document.getElementById('omFill').className='out-mbtn'+(m==='fill'?' on':'');
  var fcr=document.getElementById('fillColorRow');
  fcr.className='ctrl-row'+(m==='fill'?' visible':'');
  // fillモードはチェッカー不要
  document.getElementById('checkerBg').style.display=(m==='transp'?'':'none');
  scheduleRender();
}

// ---- 背景色ピッカー ----
document.getElementById('bgColorPicker').oninput=function(){
  bgColor=hexToRgb(this.value);
  document.getElementById('bgSwatchEl').style.background=this.value;
  document.getElementById('bgColorHex').textContent=this.value.toUpperCase();
  scheduleRender();
};

// ---- 塗り替え色ピッカー ----
document.getElementById('fillColorPicker').oninput=function(){
  fillColor=hexToRgb(this.value);
  document.getElementById('fillSwatchEl').style.background=this.value;
  document.getElementById('fillColorHex').textContent=this.value.toUpperCase();
  scheduleRender();
};

// ---- スポイト ----
function setPickMode(m){
  pickMode=m;
  document.getElementById('btnManual').className='mbtn'+(m==='manual'?' on':'');
  document.getElementById('btnEye').className='mbtn'+(m==='eye'?' on':'');
  document.getElementById('eyedropHint').className='eyedrop-hint'+(m==='eye'?' visible':'');
  document.getElementById('previewCanvas').style.cursor=(m==='eye'?'crosshair':'default');
}

document.getElementById('previewCanvas').addEventListener('click',function(e){
  if(pickMode!=='eye') return;
  var rect=this.getBoundingClientRect();
  var s=rect.width/imgW;
  var x=Math.floor((e.clientX-rect.left)/s);
  var y=Math.floor((e.clientY-rect.top)/s);
  var px=document.getElementById('srcCanvas').getContext('2d').getImageData(x,y,1,1).data;
  bgColor={r:px[0],g:px[1],b:px[2]};
  var hex=rgbToHex(px[0],px[1],px[2]);
  document.getElementById('bgColorPicker').value=hex;
  document.getElementById('bgSwatchEl').style.background=hex;
  document.getElementById('bgColorHex').textContent=hex.toUpperCase();
  setPickMode('manual');
  scheduleRender();
});

// ---- スライダー ----
['threshold','softness','spill'].forEach(function(id){
  document.getElementById(id).oninput=function(){
    document.getElementById(id+'Val').textContent=this.value;
    scheduleRender();
  };
});

// ---- レンダリング ----
function scheduleRender(){
  if(!srcImg||renderScheduled) return;
  renderScheduled=true;
  requestAnimationFrame(doRender);
}

function doRender(){
  renderScheduled=false;
  document.getElementById('status').textContent='処理中...';
  setTimeout(function(){
    var t0=Date.now();
    var threshold=parseInt(document.getElementById('threshold').value);
    var softness=parseInt(document.getElementById('softness').value);
    var spillAmt=parseInt(document.getElementById('spill').value)/100;
    var tLow=threshold;
    var tHigh=threshold+Math.max(1,softness);

    var sc=document.getElementById('srcCanvas');
    var sd=sc.getContext('2d').getImageData(0,0,imgW,imgH).data;
    var out=new ImageData(imgW,imgH);
    var od=out.data;

    var br=bgColor.r, bg=bgColor.g, bb=bgColor.b;
    var fr_=fillColor.r, fg_=fillColor.g, fb_=fillColor.b;
    var isFill=(outMode==='fill');

    for(var i=0;i<sd.length;i+=4){
      var r=sd[i],g=sd[i+1],b=sd[i+2],a=sd[i+3];
      var dist=Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb));

      if(isFill){
        // 塗り替えモード: 背景色に近いほど塗り替え色に近づける
        var ratio;
        if(dist<=tLow){ ratio=1; }
        else if(dist>=tHigh){ ratio=0; }
        else {
          var t=(dist-tLow)/(tHigh-tLow);
          ratio=1-(t*t*(3-2*t));
        }
        od[i]  =Math.round(r+(fr_-r)*ratio);
        od[i+1]=Math.round(g+(fg_-g)*ratio);
        od[i+2]=Math.round(b+(fb_-b)*ratio);
        od[i+3]=a;
      } else {
        // 透過モード
        var alpha;
        if(dist<=tLow){ alpha=0; }
        else if(dist>=tHigh){ alpha=a; }
        else {
          var t=(dist-tLow)/(tHigh-tLow);
          alpha=Math.round(t*t*(3-2*t)*a);
        }
        var fr=r, fg=g, fb=b;
        if(spillAmt>0&&alpha>0&&alpha<a){
          var blend=spillAmt*(1-alpha/255);
          var lum=0.299*r+0.587*g+0.114*b;
          fr=Math.round(r+(lum-r)*blend);
          fg=Math.round(g+(lum-g)*blend);
          fb=Math.round(b+(lum-b)*blend);
        }
        od[i]=fr; od[i+1]=fg; od[i+2]=fb; od[i+3]=alpha;
      }
    }

    lastResult=out;
    document.getElementById('previewCanvas').getContext('2d').putImageData(out,0,0);
    document.getElementById('dlBtn').disabled=false;
    document.getElementById('status').textContent=imgW+'×'+imgH+'px — '+(Date.now()-t0)+'ms';
  },10);
}

// ---- 保存 ----
function doDl(){
  if(!lastResult) return;
  var out=document.createElement('canvas');
  out.width=imgW; out.height=imgH;
  out.getContext('2d').putImageData(lastResult,0,0);
  var url=out.toDataURL('image/png');
  document.getElementById('saveImg').src=url;
  document.getElementById('saveOverlay').className='show';
}

// ---- ユーティリティ ----
function hexToRgb(hex){
  return {
    r:parseInt(hex.slice(1,3),16),
    g:parseInt(hex.slice(3,5),16),
    b:parseInt(hex.slice(5,7),16)
  };
}
function rgbToHex(r,g,b){
  return '#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('');
}

// 初期スウォッチ
document.getElementById('bgSwatchEl').style.background='#000000';
document.getElementById('fillSwatchEl').style.background='#ffffff';
</script>
</body>
</html>
