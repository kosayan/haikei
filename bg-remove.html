<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塗りつぶしツール</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; color: #f0f0f0;
  font-family: 'Courier New', monospace;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; padding: 24px 16px; gap: 14px;
}
header {
  width: 100%; max-width: 860px;
  border-bottom: 1px solid #222; padding-bottom: 12px;
  display: flex; align-items: baseline; gap: 12px;
}
h1 { font-size: 18px; font-weight: 700; color: #e8ff00; letter-spacing: 0.1em; }
.sub { font-size: 11px; color: #555; }
.wrap { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }
.drop {
  border: 1px dashed #333; background: #141414;
  height: 100px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; position: relative;
}
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop p { font-size: 12px; color: #555; }
.ctrls {
  background: #141414; border: 1px solid #222;
  padding: 12px 16px; display: flex; flex-direction: column; gap: 12px;
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lbl { font-size: 11px; color: #555; min-width: 90px; white-space: nowrap; }
input[type=range] {
  flex: 1; min-width: 80px; height: 2px;
  -webkit-appearance: none; appearance: none;
  background: #333; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; background: #e8ff00; cursor: pointer;
}
.val { font-size: 12px; color: #e8ff00; min-width: 36px; text-align: right; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  font-family: 'Courier New', monospace; font-size: 11px;
  padding: 6px 14px; border: 1px solid #333;
  background: transparent; color: #888; cursor: pointer;
}
.btn.on { border-color: #e8ff00; color: #e8ff00; background: #1a1a0a; }
.swatch {
  width: 28px; height: 28px; border: 1px solid #444;
  cursor: pointer; position: relative; flex-shrink: 0;
}
.swatch input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.hex { font-size: 12px; color: #e8ff00; min-width: 70px; }
.canvas-area {
  display: none; border: 1px solid #222; overflow: hidden;
  background-image:
    linear-gradient(45deg,#1e1e1e 25%,transparent 25%),
    linear-gradient(-45deg,#1e1e1e 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#1e1e1e 75%),
    linear-gradient(-45deg,transparent 75%,#1e1e1e 75%);
  background-size: 16px 16px;
  background-position: 0 0,0 8px,8px -8px,-8px 0;
}
.canvas-area.show { display: block; }
canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
.status { font-size: 11px; color: #555; min-height: 16px; }
.info { font-size: 11px; color: #444; line-height: 1.7; }
.act {
  font-family: 'Courier New', monospace; font-size: 11px;
  padding: 9px 18px; border: 1px solid #333;
  background: transparent; color: #f0f0f0; cursor: pointer;
}
.act.primary { background: #e8ff00; color: #000; border-color: #e8ff00; font-weight: 700; }
.act.red { border-color: #f44; color: #f44; }
.act:disabled { opacity: 0.3; cursor: not-allowed; }
#fillRow { display: none; }
#saveOverlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.93); z-index: 100;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 24px;
}
#saveOverlay.show { display: flex; }
#saveOverlay img { max-width: 100%; max-height: 60vh; border: 1px solid #333; }
#saveOverlay p { font-size: 13px; color: #aaa; text-align: center; line-height: 1.7; }
#saveOverlay button {
  font-family: 'Courier New', monospace; font-size: 12px;
  padding: 10px 24px; border: 1px solid #555;
  background: transparent; color: #f0f0f0; cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>塗りつぶしツール</h1>
  <span class="sub">タップした箇所の隣接同色を透過 or 塗り替え</span>
</header>
<div class="wrap">

  <div class="drop" id="drop">
    <input type="file" accept="image/*" id="file">
    <div style="font-size:22px;opacity:0.3">＋</div>
    <p id="dropMsg">画像をタップして選択</p>
  </div>

  <div class="ctrls">

    <!-- 動作モード -->
    <div class="row">
      <div class="lbl">動作</div>
      <div class="btns">
        <button class="btn on" id="mTransp" onclick="setMode('transp')">透過</button>
        <button class="btn"    id="mFill"   onclick="setMode('fill')">色に塗り替え</button>
        <button class="btn"    id="mRestore" onclick="setMode('restore')">復元</button>
      </div>
    </div>

    <!-- 塗り替え色（fillのみ） -->
    <div class="row" id="fillRow">
      <div class="lbl">塗り替え色</div>
      <div class="swatch" id="fillSwatch" style="background:#ffffff">
        <input type="color" id="fillPicker" value="#ffffff">
      </div>
      <div class="hex" id="fillHex">#FFFFFF</div>
    </div>

    <!-- 許容誤差 -->
    <div class="row">
      <div class="lbl">許容誤差</div>
      <input type="range" id="tol" min="0" max="150" value="30">
      <div class="val" id="tolVal">30</div>
    </div>

  </div>

  <div class="canvas-area" id="area">
    <canvas id="cv"></canvas>
  </div>

  <div class="status" id="st"></div>

  <div class="btns">
    <button class="act" id="bUndo" onclick="doUndo()" disabled>← 元に戻す</button>
    <button class="act red" id="bClear" onclick="doClear()" disabled>リセット</button>
    <button class="act primary" id="bDl" onclick="doDl()" disabled>↓ PNG保存</button>
  </div>

  <div class="info">
    画像をタップ → その点から繋がった同色範囲だけを処理します。<br>
    「透過」は消して透明に、「色に塗り替え」は指定色で塗ります。<br>
    許容誤差を上げると広い範囲が対象になります。
  </div>
</div>

<div id="saveOverlay">
  <img id="saveImg" src="" alt="">
  <p>iOSは長押し →「写真に追加」で保存<br>PCは右クリック → 名前を付けて保存</p>
  <button onclick="document.getElementById('saveOverlay').className=''">閉じる</button>
</div>

<canvas id="src" style="display:none"></canvas>

<script>
var W=0, H=0, srcImg=null;
var pixels=null;   // 現在の画像データ(Uint8ClampedArray) 編集対象
var mode='transp'; // transp | fill | restore
var fillR=255, fillG=255, fillB=255;
var stack=[];

document.getElementById('tol').oninput=function(){ document.getElementById('tolVal').textContent=this.value; };

// 読み込み
document.getElementById('drop').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('drop').addEventListener('drop',function(e){e.preventDefault();load(e.dataTransfer.files[0]);});
document.getElementById('file').onchange=function(){load(this.files[0]);};

function load(f){
  if(!f||!f.type.match(/^image\//)) return;
  var rd=new FileReader();
  rd.onload=function(e){
    var img=new Image();
    img.onload=function(){
      srcImg=img; W=img.width; H=img.height;
      var s=document.getElementById('src');
      s.width=W; s.height=H;
      var sctx=s.getContext('2d');
      sctx.drawImage(img,0,0);
      // 編集用ピクセルデータを取得
      pixels=sctx.getImageData(0,0,W,H).data;
      stack=[];
      var cv=document.getElementById('cv');
      cv.width=W; cv.height=H;
      setupTap(cv);
      document.getElementById('area').className='canvas-area show';
      document.getElementById('bClear').disabled=false;
      document.getElementById('bDl').disabled=false;
      document.getElementById('dropMsg').textContent='✓ 読み込み済み（タップで変更）';
      render();
    };
    img.src=e.target.result;
  };
  rd.readAsDataURL(f);
}

function setupTap(cv){
  var nc=document.createElement('canvas');
  nc.id='cv'; nc.width=cv.width; nc.height=cv.height;
  cv.parentNode.replaceChild(nc,cv);
  function tap(e){
    e.preventDefault();
    var touch=e.changedTouches?e.changedTouches[0]:e;
    var r=nc.getBoundingClientRect();
    var s=r.width/W;
    var x=Math.floor((touch.clientX-r.left)/s);
    var y=Math.floor((touch.clientY-r.top)/s);
    if(x<0||x>=W||y<0||y>=H) return;
    fill(x,y);
  }
  nc.addEventListener('click',tap);
  nc.addEventListener('touchend',tap,{passive:false});
}

// フラッドフィル
function fill(sx,sy){
  var tol=parseInt(document.getElementById('tol').value);
  var tolSq=tol*tol*3;

  // タップ地点の色（現在のpixelsから取得）
  var ti=(sy*W+sx)*4;
  var tr=pixels[ti], tg=pixels[ti+1], tb=pixels[ti+2];

  // undo保存
  stack.push(pixels.slice());
  if(stack.length>10) stack.shift();
  document.getElementById('bUndo').disabled=false;

  var visited=new Uint8Array(W*H);
  var qx=new Int32Array(W*H);
  var qy=new Int32Array(W*H);
  var head=0, tail=0;
  qx[tail]=sx; qy[tail]=sy; tail++;
  visited[sy*W+sx]=1;
  var count=0;
  var t0=Date.now();

  // 塗り替え先/復元用の元画像
  var srcData=null;
  if(mode==='restore'){
    srcData=document.getElementById('src').getContext('2d').getImageData(0,0,W,H).data;
  }

  while(head<tail){
    var cx=qx[head], cy=qy[head]; head++;
    var idx=cy*W+cx;
    var pi=idx*4;
    var dr=pixels[pi]-tr, dg=pixels[pi+1]-tg, db=pixels[pi+2]-tb;
    if(dr*dr+dg*dg+db*db>tolSq) continue;

    // 処理適用
    if(mode==='transp'){
      pixels[pi+3]=0;
    } else if(mode==='fill'){
      pixels[pi]=fillR; pixels[pi+1]=fillG; pixels[pi+2]=fillB; pixels[pi+3]=255;
    } else if(mode==='restore'){
      pixels[pi]=srcData[pi]; pixels[pi+1]=srcData[pi+1];
      pixels[pi+2]=srcData[pi+2]; pixels[pi+3]=srcData[pi+3];
    }
    count++;

    var nx,ny,ni;
    if(cx>0)   { nx=cx-1; ny=cy;   ni=ny*W+nx; if(!visited[ni]){visited[ni]=1; qx[tail]=nx;qy[tail]=ny;tail++;} }
    if(cx<W-1) { nx=cx+1; ny=cy;   ni=ny*W+nx; if(!visited[ni]){visited[ni]=1; qx[tail]=nx;qy[tail]=ny;tail++;} }
    if(cy>0)   { nx=cx;   ny=cy-1; ni=ny*W+nx; if(!visited[ni]){visited[ni]=1; qx[tail]=nx;qy[tail]=ny;tail++;} }
    if(cy<H-1) { nx=cx;   ny=cy+1; ni=ny*W+nx; if(!visited[ni]){visited[ni]=1; qx[tail]=nx;qy[tail]=ny;tail++;} }
  }

  document.getElementById('st').textContent=count.toLocaleString()+' px — '+(Date.now()-t0)+'ms';
  render();
}

function render(){
  var cv=document.getElementById('cv');
  if(!cv||!pixels) return;
  var ctx=cv.getContext('2d');
  var id=ctx.createImageData(W,H);
  id.data.set(pixels);
  ctx.putImageData(id,0,0);
}

function setMode(m){
  mode=m;
  document.getElementById('mTransp').className='btn'+(m==='transp'?' on':'');
  document.getElementById('mFill').className='btn'+(m==='fill'?' on':'');
  document.getElementById('mRestore').className='btn'+(m==='restore'?' on':'');
  document.getElementById('fillRow').style.display=(m==='fill'?'flex':'none');
}

document.getElementById('fillPicker').oninput=function(){
  var h=this.value;
  fillR=parseInt(h.slice(1,3),16); fillG=parseInt(h.slice(3,5),16); fillB=parseInt(h.slice(5,7),16);
  document.getElementById('fillSwatch').style.background=h;
  document.getElementById('fillHex').textContent=h.toUpperCase();
};

function doUndo(){
  if(!stack.length) return;
  pixels=stack.pop();
  if(!stack.length) document.getElementById('bUndo').disabled=true;
  render();
  document.getElementById('st').textContent='元に戻しました';
}

function doClear(){
  // 元画像に戻す
  stack.push(pixels.slice());
  if(stack.length>10) stack.shift();
  document.getElementById('bUndo').disabled=false;
  pixels=document.getElementById('src').getContext('2d').getImageData(0,0,W,H).data;
  render();
  document.getElementById('st').textContent='リセットしました';
}

function doDl(){
  var out=document.createElement('canvas');
  out.width=W; out.height=H;
  var ctx=out.getContext('2d');
  var id=ctx.createImageData(W,H);
  id.data.set(pixels);
  ctx.putImageData(id,0,0);
  var url=out.toDataURL('image/png');
  document.getElementById('saveImg').src=url;
  document.getElementById('saveOverlay').className='show';
}
</script>
</body>
</html>
